<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auteurs - Bibliothèque</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<header>
    <h1>Gestion de la bibliothèque</h1>

        <nav>
            <a class="" href="index.html">Dashboard</a>
            <a class="" href="livres.html">Livres</a>
            <a class="" href="membres.html">Membres</a>
            <a class="active" href="auteurs.html">Auteurs</a>
            <a class="" href="emprunts.html">Emprunts</a>
        </nav>

</header>
<main>
    <section class="page-header">
        <h2>Auteurs</h2>
        <p>Gestion des auteurs</p>
    </section>

    <section>
        <h2 id="titre-form-auteur">Ajouter un auteur</h2>
        <div id="message-auteur" class="message"></div>
        <form id="form-auteur">
            <input type="hidden" id="id-auteur">
            <input type="text" id="nom-auteur" placeholder="Nom de l'auteur" required>
            <input type="text" id="nationalite-auteur" placeholder="Nationalité" required>
            <div class="actions">
                <button type="submit" id="bouton-auteur">Ajouter l'auteur</button>
                <button type="button" class="secondary" id="annuler-auteur" hidden>Annuler</button>
            </div>
        </form>
    </section>

    <section>
        <h2>Liste des auteurs</h2>
        <div id="liste-auteurs"></div>
    </section>

</main>
<script src="script.js"></script>
</body>
</html>
