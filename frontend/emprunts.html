<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Emprunts - Bibliothèque</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Gestion de la bibliothèque</h1>

        <nav>
            <a href="index.html">Dashboard</a>
            <a href="livres.html">Livres</a>
            <a href="membres.html">Membres</a>
            <a href="emprunts.html">Emprunts</a>
        </nav>
    </header>

    <main>

        <section class="page-header">
            <h2>Emprunts</h2>
            <p>Gestion des emprunts et des retours</p>
        </section>

        <section>

            <h2>Enregistrer un emprunt</h2>

            <div id="message-emprunt" class="message"></div>

            <form id="form-emprunt">

                <select id="membre-emprunt">
                    <option value="">
                        Choisir un membre
                    </option>
                </select>

                <select id="livre-emprunt">
                    <option value="">
                        Choisir un livre
                    </option>
                </select>

                <label for="date-retour">
                    Date de retour prévue
                </label>

                <input
                    type="date"
                    id="date-retour"
                >

                <button type="submit">
                    Enregistrer l'emprunt
                </button>

            </form>

        </section>

        <section>

            <h2>Emprunts en cours</h2>

            <div id="liste-emprunts"></div>

        </section>

        <section>

            <h2>Emprunts en retard</h2>

            <div id="liste-retards"></div>

        </section>

    </main>

    <script src="script.js"></script>
</body>
</html>
