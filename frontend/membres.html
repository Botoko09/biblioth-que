<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Membres - Bibliothèque</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Gestion de la bibliothèque</h1>

        <nav>
            <a href="index.html">Dashboard</a>
            <a href="livres.html">Livres</a>
            <a href="membres.html">Membres</a>
            <a href="emprunts.html">Emprunts</a>
        </nav>
    </header>

    <main>

        <section class="page-header">
            <h2>Membres</h2>
            <p>Gestion des membres de la bibliothèque</p>
        </section>

        <section>

            <h2>Ajouter un membre</h2>

            <div id="message-membre" class="message"></div>

            <form id="form-membre">

                <input
                    type="text"
                    id="nom-membre"
                    placeholder="Nom du membre"
                >

                <input
                    type="text"
                    id="contact-membre"
                    placeholder="Contact"
                >

                <button type="submit">
                    Ajouter le membre
                </button>

            </form>

        </section>

        <section>

            <h2>Liste des membres</h2>

            <div id="liste-membres"></div>

        </section>

    </main>

    <script src="script.js"></script>
</body>
</html>
